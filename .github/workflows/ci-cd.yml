name: CI/CD Pipeline Turismo Local

on:
  push:
    branches:
      - main
      - develop

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Requerido por SonarCloud para un análisis completo

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and Test Backend
        run: mvn -B verify
        working-directory: ./backend

      - name: Analyze Backend with SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_TURISMO_WEB }}
        run: mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=manueldeveloper99_turismoWebv1 -Dsonar.organization=manueldeveloper99 -Dsonar.host.url=https://sonarcloud.io
        working-directory: ./backend

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Frontend Dependencies
        run: npm install
        working-directory: ./frontend

      - name: Run Frontend Tests
        run: npm test
        working-directory: ./frontend

      - name: Build Frontend
        run: npm run build
        working-directory: ./frontend

      - name: Send Discord Notification
        if: always()
        run: |
          curl -H "Content-Type: application/json" \
          -d "{\"content\": \"🚀 **Alerta del Pipeline (Turismo Web)**\n👤 **Autor:** ${{ github.actor }}\n🌿 **Rama:** ${{ github.ref_name }}\n✅ **Estado:** ${{ job.status }}\n🔗 **Ver más:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
          ${{ secrets.DISCORD_WEBHOOK }}

  # TODO: Agregar Job de Deploy (GCP Cloud Run o Firebase) dependiendo de la configuración de Secrets.
