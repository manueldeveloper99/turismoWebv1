spring.application.name=turismoweb

# H2 In-Memory Database for Tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# OAuth2 Resource Server Configuration (Google)
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://accounts.google.com
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://www.googleapis.com/oauth2/v3/certs

# Frontend URL and CORS Configuration
frontend.url=http://localhost:5173
cors.allowed-origins=http://localhost:5173

# Dummy OpenAI API Key for Tests to load the ApplicationContext successfully
spring.ai.openai.api-key=dummy-test-key-for-github-actions

# Exclude Spring AI AutoConfigurations in tests to prevent PgVector and OpenAI from crashing the H2 context
spring.autoconfigure.exclude=org.springframework.ai.autoconfigure.openai.OpenAiAutoConfiguration,org.springframework.ai.autoconfigure.vectorstore.pgvector.PgVectorStoreAutoConfiguration
