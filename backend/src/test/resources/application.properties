# Dummy OpenAI API Key for Tests to load the ApplicationContext successfully
spring.ai.openai.api-key=dummy-test-key-for-github-actions

# Exclude Spring AI AutoConfigurations in tests to prevent PgVector and OpenAI from crashing the H2 context
spring.autoconfigure.exclude=\
  org.springframework.ai.autoconfigure.openai.OpenAiAutoConfiguration,\
  org.springframework.ai.autoconfigure.vectorstore.pgvector.PgVectorStoreAutoConfiguration
