spring.application.name=turismoweb

# H2 In-Memory Database Configuration
spring.datasource.url=jdbc:h2:mem:turismodb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true

# OAuth2 Resource Server Configuration (Google)
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://accounts.google.com
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://www.googleapis.com/oauth2/v3/certs

# Frontend URL and CORS Configuration
frontend.url=${FRONTEND_URL:http://localhost:5173}
cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}